extends:
  - recommended
rules:
  # API ภายในบริษัท ไม่ต้องประกาศ license
  info-license: off
  # localhost คือ dev server จริงของโปรเจกต์นี้
  no-server-example.com: off
  # /health และ GET แบบ list (equipment, borrow-requests, repair-tickets, activity-logs) ไม่มี 4XX ตาม contract
  operation-4xx-response: off